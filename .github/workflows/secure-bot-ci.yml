name: Secure Telegram Bot CI

on:
  push:
    branches: [main]
    paths:
      - "telegram_bot_secure/**"
      - "tests/**"
      - ".github/workflows/secure-bot-ci.yml"
  pull_request:
    paths:
      - "telegram_bot_secure/**"
      - "tests/**"
      - ".github/workflows/secure-bot-ci.yml"

permissions:
  contents: read

concurrency:
  group: secure-bot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: telegram_bot_secure/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r telegram_bot_secure/requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q telegram_bot_secure

      - name: Run tests
        run: python -m pytest -q tests/test_secure_bot.py

  docker-build:
    name: Build hardened Docker image
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: telegram_bot_secure
          file: telegram_bot_secure/Dockerfile
          push: false
          tags: botlxzbezt/secure-bot:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
